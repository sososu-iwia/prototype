services:
  api:
    environment:
      DATABASE_URL: ${API_DATABASE_URL:?Set a separate least-privilege runtime PostgreSQL URL}
      # API has no host port. Caddy replaces untrusted incoming forwarding headers.
      TRUST_PROXY_CIDRS: uniquelocal
      MEDIA_STORAGE: s3
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Set an independent S3 bucket}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ALLOW_LOCAL_HTTP: "false"
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      INQUIRY_RATE_SECRET: ${INQUIRY_RATE_SECRET:-}
      TRUSTED_ORIGINS: https://${DOMAIN}
  web:
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN}
      COOKIE_SECURE: "true"
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
